<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best Buddy | Entrar</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="../../favicon.ico" />
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="../../css/tailwind.build.css?v=6" />
</head>

<body class="overflow-x-hidden">
  <div class="bb-auth-shell">
    <!-- Vídeo em Background em Loop -->
    <div class="bb-auth-video-bg" aria-hidden="true">
      <video class="bb-auth-video" autoplay loop muted playsinline preload="auto">
        <source src="../../assets/images/videoAnimesLogin.mp4" type="video/mp4" />
      </video>
      <div class="bb-auth-video-overlay"></div>
    </div>

    <!-- Header com Logo Arredondado -->
    <div id="bb-header" class="relative z-10 w-full"></div>

    <!-- Conteúdo Centralizado / Pop-up do Formulário -->
    <main class="bb-container flex justify-center items-center flex-1 relative z-10 my-auto py-6">
      <div class="bb-card bb-auth-card">
        <h1 class="bb-auth-subtitle">Entre na sua conta</h1>

        <div class="bb-alert bg-brand-500/10 border border-brand-500/40 text-brand-300 text-xs">
          <span>Modo demo: use <strong>usuario@bestbuddy.com</strong> / <strong>123456</strong></span>
        </div>

        <div id="bb-form-alert"></div>

        <form id="bb-login-form" novalidate>
          <div class="bb-field">
            <label class="bb-label" for="email">Email</label>
            <input class="bb-input" type="email" id="email" name="email" placeholder="seu@email.com" required />
            <div class="bb-error-text" id="email-error"></div>
          </div>

          <div class="bb-field">
            <label class="bb-label" for="password">Senha</label>
            <input class="bb-input" type="password" id="password" name="password" placeholder="Digite sua senha"
              required />
            <div class="bb-error-text" id="password-error"></div>
          </div>

          <div class="text-right mb-4">
            <a href="forgot-password.html">Esqueci minha senha</a>
          </div>

          <div class="bb-field mb-5">
            <label class="flex items-start gap-2.5 cursor-pointer text-xs text-ink-300 select-none">
              <input type="checkbox" id="login-cookie-consent"
                class="mt-0.5 rounded border-slate-300 text-sky-500 focus:ring-sky-400 cursor-pointer" />
              <span>
                Autorizo o armazenamento essencial de cookies e tokens de sessao (JWT) para manter minha conta conectada
                conforme a
                <a href="/pages/legal/privacy.html" target="_blank"
                  class="text-brand-400 font-semibold underline hover:text-brand-300">Politica de Privacidade</a>.
              </span>
            </label>
            <div class="bb-error-text mt-1" id="cookie-consent-error"></div>
          </div>

          <button class="bb-btn bb-btn--primary bb-btn--block" type="submit" id="bb-submit-btn">
            Entrar
          </button>
        </form>

        <div class="bb-auth-footer-link">
          <p>Ainda não tem uma conta?</p>
          <a href="register.html">Criar uma conta</a>
        </div>
      </div>
    </main>

    <footer class="bb-auth-footer-simple">
      &copy; Best Buddy | Todos os direitos reservados
    </footer>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils/storage.js"></script>
  <script src="../../js/utils/validation.js"></script>
  <script src="../../js/mocks/mock-utils.js"></script>
  <script src="../../js/mocks/mock-data.js"></script>
  <script src="../../js/api/client.js"></script>
  <script src="../../js/services/authService.js"></script>
  <script src="../../js/components/AuthHeader.js"></script>
  <script src="../../js/utils/click-limiter.js"></script>
  <script src="../../js/pages/login.js?v=6"></script>
</body>

</html>
