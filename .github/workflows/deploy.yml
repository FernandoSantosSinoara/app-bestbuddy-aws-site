name: CI/CD - Best Buddy Django API

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: hello-aws-service
  EKS_CLUSTER_NAME: cluster-app-senac-aws
  RDS_INSTANCE_IDENTIFIER: mysql-senac-aws
  K8S_DEPLOYMENT: pessoas-service-deployment
  K8S_CONTAINER: bestbuddy-api

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

  deploy:
    name: Build image and deploy to EKS
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --pull -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:bestbuddy-api" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:bestbuddy-api"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Create or update application secrets
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$DJANGO_SECRET_KEY" ]]; then
            echo "::error::Add DJANGO_SECRET_KEY to the repository Actions secrets."
            exit 1
          fi

          DB_JSON="$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE_IDENTIFIER" \
            --output json)"
          DB_HOST="$(jq -r '.DBInstances[0].Endpoint.Address // empty' <<< "$DB_JSON")"
          DB_NAME="$(jq -r '.DBInstances[0].DBName // empty' <<< "$DB_JSON")"
          DB_USER="$(jq -r '.DBInstances[0].MasterUsername // empty' <<< "$DB_JSON")"
          DB_SECRET_ARN="$(jq -r '.DBInstances[0].MasterUserSecret.SecretArn // empty' <<< "$DB_JSON")"

          if [[ -z "$DB_HOST" || -z "$DB_NAME" || -z "$DB_USER" || -z "$DB_SECRET_ARN" ]]; then
            echo "::error::Could not read the RDS endpoint, database, user, or managed password secret."
            exit 1
          fi

          DB_PASSWORD="$(aws secretsmanager get-secret-value \
            --secret-id "$DB_SECRET_ARN" \
            --query SecretString \
            --output text | jq -r '.password // empty')"
          if [[ -z "$DB_PASSWORD" ]]; then
            echo "::error::The RDS-managed secret does not contain a password."
            exit 1
          fi
          echo "::add-mask::$DB_PASSWORD"

          kubectl create secret generic bestbuddy-api-secrets \
            --from-literal=SECRET_KEY="$DJANGO_SECRET_KEY" \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Deploy the image built by this run
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          kubectl set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE"
          kubectl rollout status "deployment/$K8S_DEPLOYMENT" --timeout=300s
